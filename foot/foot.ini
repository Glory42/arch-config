include=~/.config/foot/theme.ini


[main]
font=JetBrainsMono Nerd Font:size=10
pad=8x8
initial-window-size-chars=100x30
selection-target=both

[colors-dark]
# Windows are made see-through by Hyprland (SUPER + O), so foot stays solid
alpha=1.0

[cursor]
style=beam
blink=yes

[scrollback]
lines=10000
